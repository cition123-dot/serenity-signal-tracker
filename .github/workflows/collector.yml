name: X Collector

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: x-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect latest posts
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          WORKER_INGEST_SECRET: ${{ secrets.WORKER_INGEST_SECRET }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          HEADLESS: "true"
          RUN_ONCE: "true"
          COLLECTOR_LABEL: "github-actions"
          BACKFILL_ON_START_DAYS: "0"
          MAX_BACKFILL_SCROLLS: "40"
          PLAYWRIGHT_PROFILE_DIR: ${{ runner.temp }}/playwright-profile
        run: npx tsx worker/collector.ts
